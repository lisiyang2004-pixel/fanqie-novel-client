[package]
name = "fanqie-novel-client"
version = "0.1.0"
description = "番茄小说下载客户端"
authors = ["you"]
edition = "2021"
rust-version = "1.77.0"

[lib]
name = "fanqie_novel_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "gzip"], default-features = false }
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
rusqlite_migration = "1.3"
thiserror = "2"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
base64 = "0.22"
md-5 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
zip = "2"
percent-encoding = "2"
regex = "1"
urlencoding = "2"
once_cell = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
